<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Sales - Kigezi Traders</title><style>body{font-family:Arial;padding:20px;background:#f5f5f5}.nav{background:#2e7d32;padding:15px;margin:-20px -20px 20px -20px}.nav a{color:white;margin-right:15px;text-decoration:none;font-weight:bold}.card{background:white;padding:20px;border-radius:8px;margin-bottom:20px}input,select{padding:8px;margin:5px;border:1px solid #ccc;border-radius:4px}button{padding:8px 12px;background:#2e7d32;color:white;border:none;border-radius:4px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ddd;padding:8px;font-size:13px}th{background:#2e7d32;color:white}</style></head><body>
<div class="nav"><a href="/dashboard.html">Dashboard</a><a href="/products.html">Products</a><a href="/suppliers.html">Suppliers</a><a href="/purchases.html">Purchases</a><a href="/sales.html">Sales</a><a href="/reports.html">Reports</a><a href="#" onclick="logout()">Logout</a></div>

<div class="card"><h3>New Sale - Stock Out</h3>
<label>Customer Name: <input id="customer" placeholder="Walk-in Customer"></label><br><br>
<label>Product: <select id="productSelect"><option>Loading products...</option></select>
Qty: <input id="qty" type="number" value="1" min="1" style="width:60px">
Price: <input id="price" placeholder="Selling Price" style="width:90px">
<button onclick="addToList()" style="background:#ff9800">Add to List</button></label>
<table><thead><tr><th>PRODUCT</th><th>QTY</th><th>PRICE</th><th>SUBTOTAL</th><th>ACTION</th></tr></thead><tbody id="cart"></tbody></table>
<p><b>Total: UGX <span id="total">0</span></b></p>
<button onclick="recordSale()" style="padding:12px 20px;background:#c62828;font-weight:bold">RECORD SALE</button>
</div>

<div class="card"><h3>Sales History</h3><table><thead><tr><th>ID</th><th>SALE NO</th><th>CUSTOMER</th><th>TOTAL</th><th>DATE</th></tr></thead><tbody id="history"></tbody></table></div>

<script>
let cart=[];
function getToken(){return localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('jwt')||''}
function headers(){const h={'Content-Type':'application/json'};const t=getToken();if(t)h['Authorization']='Bearer '+t;return h;}
function logout(){localStorage.clear();location.href='/login.html';}

async function loadProducts(){
  const res=await fetch('/api/products',{headers:headers()});
  const json=await res.json();const data=Array.isArray(json)?json:(json.products||json.data||[]);
  const sel=document.getElementById('productSelect');sel.innerHTML='';
  if(data.length===0){sel.innerHTML='<option>No products</option>';return;}
  data.forEach(p=>{
    const name=p.product_name||p.name||p.item_name||('Product #'+p.id);
    const stock=p.quantity||p.stock||p.stock_quantity||0;
    const sprice=p.selling_price||p.sell_price||p.price||p.unit_price||0;
    const opt=document.createElement('option');opt.value=p.id;
    opt.textContent=`${name} - Stock:${stock}`;opt.dataset.name=name;opt.dataset.price=sprice;sel.appendChild(opt);
  });
  sel.onchange=()=>{const o=sel.options[sel.selectedIndex];document.getElementById('price').value=o.dataset.price||'';}
  if(sel.options[0]) document.getElementById('price').value=sel.options[0].dataset.price||'';
}

function addToList(){
  const sel=document.getElementById('productSelect');const pid=sel.value;const pname=sel.options[sel.selectedIndex].dataset.name;
  const qty=parseInt(document.getElementById('qty').value)||1;const price=parseFloat(document.getElementById('price').value)||0;
  if(!pid)return alert('Select product');cart.push({product_id:pid,product_name:pname,quantity:qty,unit_price:price,subtotal:qty*price});
  renderCart();
}
function renderCart(){
  const tbody=document.getElementById('cart');tbody.innerHTML='';let total=0;
  cart.forEach((c,i)=>{total+=c.subtotal;tbody.innerHTML+=`<tr><td>${c.product_name}</td><td>${c.quantity}</td><td>${c.unit_price}</td><td>${c.subtotal}</td><td><button onclick="cart.splice(${i},1);renderCart()">Remove</button></td></tr>`;});
  document.getElementById('total').textContent=total;
}
async function recordSale(){
  if(cart.length===0)return alert('Cart empty');
  const customer=document.getElementById('customer').value||'Walk-in Customer';
  const total=cart.reduce((a,b)=>a+b.subtotal,0);
  const res=await fetch('/api/sales',{method:'POST',headers:headers(),body:JSON.stringify({customer_name:customer,items:cart,total,products:cart})});
  const txt=await res.text();console.log(txt);
  if(!res.ok){alert('Failed: '+txt);return;}
  alert('Sale Recorded!');cart=[];renderCart();loadHistory();loadProducts();
}
async function loadHistory(){
  const res=await fetch('/api/sales',{headers:headers()});
  const json=await res.json();const data=Array.isArray(json)?json:(json.sales||json.data||[]);
  const tbody=document.getElementById('history');tbody.innerHTML='';
  data.forEach(s=>{tbody.innerHTML+=`<tr><td>${s.id}</td><td>${s.sale_no||s.id}</td><td>${s.customer_name||'Walk-in'}</td><td>${s.total_amount||s.total}</td><td>${(s.created_at||'').substring(0,10)}</td></tr>`;});
}
loadProducts();loadHistory();
</script></body></html>
