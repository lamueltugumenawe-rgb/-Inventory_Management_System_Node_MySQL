<!DOCTYPE html><html><head><title>Dashboard - Kigezi</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;margin:0;background:#f5f7fb}.nav{background:#1a5d1a;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.nav a{color:white;margin:0 8px;text-decoration:none;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;padding:20px}.card{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.num{font-size:28px;font-weight:bold;color:#1a5d1a}.low{background:#ffebee}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{border:1px solid #ddd;padding:8px;text-align:left}.table th{background:#e8f5e9}</style></head><body>
<div class="nav"><div><b>🏪 Kigezi Traders</b> - <span id="role">Loading...</span></div><div><a href="dashboard.html">Dashboard</a><a href="index.html">Products</a><a href="suppliers.html">Suppliers</a><a href="purchases.html">Purchases</a><a href="sales.html">Sales</a><a href="reports.html">Reports</a><a href="#" onclick="logout()">Logout</a></div></div>
<div class="grid"><div class="card"><div>Total Products</div><div class="num" id="totalProd">0</div></div><div class="card low"><div>Low Stock Items</div><div class="num" id="lowCount">0</div></div><div class="card"><div>Sales Today</div><div class="num" id="salesToday">0</div><small id="salesAmt"></small></div><div class="card"><div>Purchases Today</div><div class="num" id="purToday">0</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 20px"><div class="card"><h3>Low Stock Alert (≤ Reorder)</h3><table class="table" id="lowTable"><tr><th>Code</th><th>Name</th><th>Stock</th><th>Reorder</th></tr></table></div><div class="card"><h3>Recent Sales</h3><table class="table" id="recentTable"><tr><th>Sale No</th><th>Amount</th><th>Date</th></tr></table></div></div>
<script>async function check(){const r=await fetch('/api/me');const d=await r.json();if(!d.user){location.href='login.html';return;}document.getElementById('role').innerText=d.user.full_name+' ('+d.user.role+')';}check();async function load(){const res=await fetch('/api/reports/dashboard');const data=await res.json();document.getElementById('totalProd').innerText=data.totalProducts;document.getElementById('lowCount').innerText=data.lowStockCount;document.getElementById('salesToday').innerText=data.salesToday.count;document.getElementById('salesAmt').innerText='UGX '+data.salesToday.total;document.getElementById('purToday').innerText=data.purchasesToday.count;const lt=document.getElementById('lowTable');data.lowStock.forEach(p=>{lt.innerHTML+=`<tr><td>${p.product_code}</td><td>${p.product_name}</td><td style="color:red">${p.current_stock}</td><td>${p.reorder_level}</td></tr>`});const rt=document.getElementById('recentTable');data.recentSales.forEach(s=>{rt.innerHTML+=`<tr><td>${s.sale_no}</td><td>${s.total_amount}</td><td>${new Date(s.sale_date).toLocaleString()}</td></tr>`});}load();async function logout(){await fetch('/api/logout',{method:'POST'});localStorage.clear();location.href='login.html';}</script></body></html>
