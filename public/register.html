<!DOCTYPE html><html><head><title>Register - Kigezi Traders</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#f5f7fb;display:flex;justify-content:center;align-items:center;height:100vh} .card{background:white;padding:25px;border-radius:10px;box-shadow:0 2px 10px #ccc;width:350px}input,select,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}button{background:#1a5d1a;color:white;border:none;border-radius:5px;font-weight:bold;cursor:pointer}</style></head><body><div class="card"><h3 style="text-align:center">🏪 Kigezi Traders - Create Account</h3><input id="username" placeholder="Username"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><select id="role"><option value="customer">Customer (Buy Products)</option><option value="supplier">Supplier (Supply Goods)</option><option value="storekeeper">Storekeeper (Staff)</option><option value="manager">Manager (Staff)</option></select><button onclick="register()">Create Account</button><p style="text-align:center"><a href="login.html">Already have account? Login</a></p><p id="msg"></p></div><script>async function register(){const body={username:username.value,email:email.value,password:password.value,role:role.value};const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();document.getElementById('msg').innerText=j.message||j.error;if(r.ok){setTimeout(()=>location.href='login.html',1000)}}</script></body></html>
