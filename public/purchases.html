<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Purchases - Kigezi Traders</title><style>body{font-family:Arial;padding:20px;background:#f5f5f5}.nav{background:#2e7d32;padding:15px;margin:-20px -20px 20px -20px}.nav a{color:white;margin-right:15px;text-decoration:none;font-weight:bold}.card{background:white;padding:20px;border-radius:8px;margin-bottom:20px}input,select{padding:8px;margin:5px;border:1px solid #ccc;border-radius:4px}button{padding:8px 12px;background:#2e7d32;color:white;border:none;border-radius:4px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ddd;padding:8px;font-size:13px}th{background:#2e7d32;color:white}</style></head><body>
<div class="nav"><a href="/dashboard.html">Dashboard</a><a href="/products.html">Products</a><a href="/suppliers.html">Suppliers</a><a href="/purchases.html">Purchases</a><a href="/sales.html">Sales</a><a href="#" onclick="logout()">Logout</a></div>

<div class="card"><h3>New Purchase - Stock In</h3>
<label>Supplier: <select id="supplierSelect"><option>Loading...</option></select></label><br><br>
<label>Product: <select id="productSelect"><option>Loading products...</option></select>
<input id="qty" type="number" value="1" min="1" style="width:60px"><input id="cost" placeholder="Unit Cost" style="width:80px"><button onclick="addToList()" style="background:orange">Add to List</button></label>
<table><thead><tr><th>PRODUCT</th><th>QTY</th><th>COST</th><th>SUBTOTAL</th><th>ACTION</th></tr></thead><tbody id="cart"></tbody></table>
<p><b>Total: UGX <span id="total">0</span></b></p>
<button onclick="recordPurchase()" style="padding:12px 20px;background:#1b5e20;font-weight:bold">RECORD PURCHASE</button>
</div>

<div class="card"><h3>Purchases History</h3><table><thead><tr><th>ID</th><th>PURCHASE NO</th><th>SUPPLIER</th><th>TOTAL</th><th>DATE</th></tr></thead><tbody id="history"></tbody></table></div>

<script>
let cart=[];
function getToken(){return localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('jwt')||''}
function headers(){const h={'Content-Type':'application/json'};const t=getToken();if(t)h['Authorization']='Bearer '+t;return h;}
function logout(){localStorage.clear();location.href='/login.html';}

async function loadSuppliers(){
  const res=await fetch('/api/suppliers',{headers:headers()});
  const json=await res.json();const data=Array.isArray(json)?json:(json.suppliers||json.data||[]);
  const sel=document.getElementById('supplierSelect');sel.innerHTML='';
  if(data.length===0){sel.innerHTML='<option>No suppliers - Add first</option>';return;}
  data.forEach(s=>{
    const name=s.supplier_name||s.name||s.supplier_code||('Supplier #'+s.id);
    const opt=document.createElement('option');opt.value=s.id;opt.textContent=name;sel.appendChild(opt);
  });
}

async function loadProducts(){
  const res=await fetch('/api/products',{headers:headers()});
  const json=await res.json();const data=Array.isArray(json)?json:(json.products||json.data||[]);
  const sel=document.getElementById('productSelect');sel.innerHTML='';
  if(data.length===0){sel.innerHTML='<option>No products</option>';return;}
  data.forEach(p=>{
    const name=p.product_name||p.name||p.item_name||('Product #'+p.id);
    const stock=p.quantity||p.stock||p.stock_quantity||0;
    const opt=document.createElement('option');opt.value=p.id;opt.textContent=`${name} - Stock:${stock}`;opt.dataset.name=name;opt.dataset.cost=p.cost_price||p.buying_price||p.unit_price||0;sel.appendChild(opt);
  });
  sel.onchange=()=>{const o=sel.options[sel.selectedIndex];document.getElementById('cost').value=o.dataset.cost||'';}
  if(sel.options[0]) document.getElementById('cost').value=sel.options[0].dataset.cost||'';
}

function addToList(){
  const sel=document.getElementById('productSelect');const pid=sel.value;const pname=sel.options[sel.selectedIndex].dataset.name;
  const qty=parseInt(document.getElementById('qty').value)||1;const cost=parseFloat(document.getElementById('cost').value)||0;
  if(!pid)return alert('Select product');cart.push({product_id:pid,product_name:pname,quantity:qty,unit_cost:cost,subtotal:qty*cost});
  renderCart();
}
function renderCart(){
  const tbody=document.getElementById('cart');tbody.innerHTML='';let total=0;
  cart.forEach((c,i)=>{total+=c.subtotal;tbody.innerHTML+=`<tr><td>${c.product_name}</td><td>${c.quantity}</td><td>${c.unit_cost}</td><td>${c.subtotal}</td><td><button onclick="cart.splice(${i},1);renderCart()">Remove</button></td></tr>`;});
  document.getElementById('total').textContent=total;
}
async function recordPurchase(){
  if(cart.length===0)return alert('Cart empty');
  const supplier_id=document.getElementById('supplierSelect').value;
  const total=cart.reduce((a,b)=>a+b.subtotal,0);
  const res=await fetch('/api/purchases',{method:'POST',headers:headers(),body:JSON.stringify({supplier_id,items:cart,total,products:cart})});
  const txt=await res.text();console.log(txt);
  if(!res.ok){alert('Failed: '+txt);return;}
  alert('Purchase Recorded!');cart=[];renderCart();loadHistory();loadProducts();
}
async function loadHistory(){
  const res=await fetch('/api/purchases',{headers:headers()});
  const json=await res.json();const data=Array.isArray(json)?json:(json.purchases||json.data||[]);
  const tbody=document.getElementById('history');tbody.innerHTML='';
  data.forEach(p=>{tbody.innerHTML+=`<tr><td>${p.id}</td><td>${p.purchase_no||p.id}</td><td>${p.supplier_name||p.supplier_id}</td><td>${p.total_amount||p.total}</td><td>${(p.created_at||'').substring(0,10)}</td></tr>`;});
}
loadSuppliers();loadProducts();loadHistory();
</script></body></html>
