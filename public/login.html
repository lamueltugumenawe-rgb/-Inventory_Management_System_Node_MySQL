<!DOCTYPE html><html><head><title>Kigezi - Login</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#f0f4f8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);width:340px}h2{color:#1a5d1a;text-align:center}input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}button{width:100%;padding:12px;background:#1a5d1a;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold}.info{font-size:12px;background:#e8f5e9;padding:10px;border-radius:6px;margin-top:10px}</style></head><body><div class="card"><h2>🏪 Kigezi Traders</h2><p style="text-align:center">Inventory Management System</p><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="msg" style="color:red;text-align:center;margin-top:10px"></div><div class="info"><b>Default Accounts (password: Kigezi123):</b><br>manager - Full access<br>storekeeper - Products/Suppliers/Purchases<br>salesperson - Sales<br>accountant - Reports<br>admin - All</div></div><script>async function login(){const u=document.getElementById('username').value;const p=document.getElementById('password').value;const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const data=await res.json();if(res.ok){localStorage.setItem('user',JSON.stringify(data.user));location.href='dashboard.html';}else document.getElementById('msg').innerText=data.error;}</script></body></html>
