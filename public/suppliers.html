<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Suppliers - Kigezi Traders</title><style>body{font-family:Arial;padding:20px;background:#f5f5f5}.nav{background:#2e7d32;padding:15px;margin:-20px -20px 20px -20px}.nav a{color:white;margin-right:15px;text-decoration:none;font-weight:bold}.card{background:white;padding:20px;border-radius:8px}input{padding:10px;margin:5px;border:1px solid #ccc;border-radius:4px}button{padding:10px 15px;background:#2e7d32;color:white;border:none;border-radius:4px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:10px}th{background:#2e7d32;color:white}</style></head><body>
<div class="nav"><a href="/dashboard.html">Dashboard</a><a href="/products.html">Products</a><a href="/suppliers.html">Suppliers</a><a href="/purchases.html">Purchases</a><a href="/sales.html">Sales</a></div>
<div class="card"><h2>Suppliers</h2><input id="name" placeholder="Supplier Name"><input id="contact" placeholder="Contact"><input id="email" placeholder="Email"><button onclick="addSupplier()">Add Supplier</button><table><thead><tr><th>ID</th><th>Name</th><th>Contact</th><th>Email</th><th>Action</th></tr></thead><tbody id="list"></tbody></table></div>
<script>
function getToken(){return localStorage.getItem('token')||localStorage.getItem('authToken')||localStorage.getItem('jwt')||''}
function headers(){const h={'Content-Type':'application/json'};const t=getToken();if(t)h['Authorization']='Bearer '+t;return h;}
async function loadSuppliers(){
 const res=await fetch('/api/suppliers',{headers:headers()});
 const json=await res.json();
 const data=Array.isArray(json)?json:(json.suppliers||json.data||json.rows||[]);
 const tbody=document.getElementById('list');tbody.innerHTML='';
 if(data.length===0){tbody.innerHTML='<tr><td colspan=5>No suppliers yet</td></tr>';return;}
 data.forEach(s=>{tbody.innerHTML+=`<tr><td>${s.id}</td><td>${s.name||s.supplier_name||''}</td><td>${s.contact_person||s.contact||s.phone||''}</td><td>${s.email||''}</td><td><button onclick="deleteSup(${s.id})">Delete</button></td></tr>`;});
}
async function addSupplier(){
 const name=document.getElementById('name').value.trim();
 const contact=document.getElementById('contact').value.trim();
 const email=document.getElementById('email').value.trim();
 if(!name)return alert('Name required');
 const supplier_code='SUP'+Date.now();
 const res=await fetch('/api/suppliers',{method:'POST',headers:headers(),body:JSON.stringify({name,supplier_name:name,contact_person:contact,contact:contact,phone:contact,email,supplier_code,code:supplier_code})});
 const txt=await res.text();console.log(txt);
 if(!res.ok){alert('Failed: '+txt);return;}
 document.getElementById('name').value='';document.getElementById('contact').value='';document.getElementById('email').value='';
 loadSuppliers();
}
async function deleteSup(id){if(!confirm('Delete?'))return;await fetch('/api/suppliers/'+id,{method:'DELETE',headers:headers()});loadSuppliers();}
loadSuppliers();
</script></body></html>
